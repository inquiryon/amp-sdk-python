# CI for amp-sdk-python (OSS-006).
#
# Requires no private services or production secrets. The live-compat job
# checks out the public amp-core and amp-community source repositories and is
# a hard gate: checkout, installation, startup, or scenario failures
# fail CI.
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests examples
      - name: Static typing
        run: mypy
      - name: Unit tests
        run: pytest tests/unit -q

  live-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The default GITHUB_TOKEN is scoped to this repo only and 404s on a
      # second private repo, so these use a fine-grained PAT (Contents:
      # Read-only, scoped to amp-core + amp-community) instead.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/amp-core
          path: vendor/amp-core
          token: ${{ secrets.AMP_CORE_READ_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/amp-community
          path: vendor/amp-community
          token: ${{ secrets.AMP_CORE_READ_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - name: Install amp-core and amp-community from reviewed source
        run: |
          python -m pip install -e ./vendor/amp-core -e ./vendor/amp-community
          python -c "import amp_core, amp_community"
      - name: Live compatibility scenarios
        run: pytest tests/compat -q -ra

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install build
      - name: Build sdist and wheel
        run: python -m build
      - name: Inspect wheel contents
        run: |
          python -c "
          import zipfile, sys
          names = zipfile.ZipFile(sorted(__import__('glob').glob('dist/*.whl'))[0]).namelist()
          allowed_prefixes = ('amp_sdk/', 'amp_sdk-')
          bad = [n for n in names if not n.startswith(allowed_prefixes)]
          for n in sorted(names): print(n)
          if bad:
              print('::error::unexpected files in wheel:', bad); sys.exit(1)
          "
      - name: Install from wheel in a clean venv
        run: |
          python -m venv /tmp/install-test
          /tmp/install-test/bin/pip install dist/*.whl
          /tmp/install-test/bin/python -c "import amp_sdk; print(amp_sdk.AmpClient, amp_sdk.__version__)"
      - name: Dependency/license audit (expect zero runtime deps)
        run: |
          pip install pip-licenses
          /tmp/install-test/bin/pip list
          test -z "$(/tmp/install-test/bin/pip list --format=freeze | grep -v '^amp-sdk==' | grep -v '^pip==')" \
            || (echo "::error::unexpected runtime dependency installed"; exit 1)

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release hygiene checks (secrets, forbidden files, markers, dependency directories)
        run: bash scripts/check_release_hygiene.sh .
